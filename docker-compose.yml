version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:8000"
    environment:
      - PORT=8000
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - app-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./gamefrontend
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    environment:
      - VITE_PORT=5173
      - REACT_APP_API_URL=http://localhost:3001
    volumes:
      - ./gamefrontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 